openapi: 3.1.0
info:
  title: estate-dashboard API
  version: 1.0.0
  description: >-
    The contract the Go server (ogen) and the Vue client (@hey-api/openapi-ts) are both generated
    from. Change this document first; `task gen` regenerates both sides and `task gen:check` fails
    when either is stale.
  contact:
    name: Joris Jonkers
    url: https://github.com/JorisJonkers-dev
  license:
    name: Proprietary
    url: https://github.com/JorisJonkers-dev/estate-dashboard/blob/main/LICENSE
servers:
  - url: https://estate.jorisjonkers.dev
    description: Production. The SPA and the API share one origin.
    x-internal: false
security:
  - sessionCookie: []
tags:
  - name: logs
    description: What a Project's containers wrote, from Loki.
  - name: estate
    description: >-
      What the Estate repository says, read through a token that may read it and nothing else: each
      Project's pin, the commits that moved it, and the open issues.
  - name: delivery
    description: >-
      What the cluster says about delivery, read through a ServiceAccount that may get, list and
      watch and nothing else: Flux's sources and units, each gated Application's release, and the
      pods a Project runs.
  - name: checks
    description: Whether each endpoint the uptime monitor probes answers, from Gatus.
  - name: session
    description: Who is signed in.
  - name: alerts
    description: >-
      The alerts Alertmanager holds now, what the dashboard recorded about them, and the silences it
      sets there, its one write.
paths:
  /api/v1/session:
    get:
      operationId: getSession
      summary: Say who is signed in
      description: >-
        Returns the admin the session cookie belongs to. A request without a session, or with one
        auth no longer stands behind, gets a 401: the web app then shows the sign-in page.
      tags: [session]
      responses:
        "200":
          description: The signed-in admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: List the alerts firing now, newest first
      description: >-
        Returns every alert Alertmanager holds now, silenced or not, newest first. Read from
        Alertmanager on every request; nothing here is copied into the dashboard's database. A 503
        means Alertmanager did not answer, or that the dashboard runs without one.
      tags: [alerts]
      responses:
        "200":
          description: The alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/alerts/{fingerprint}/silences:
    post:
      operationId: silenceAlert
      summary: Silence an alert in Alertmanager
      description: >-
        Silences one firing alert, matching every one of its labels exactly, for an hour, four
        hours, a day, or until it resolves. The silence is set in Alertmanager, so Discord goes
        quiet too; it is the dashboard's only write. A silence until resolved lasts at most seven
        days in Alertmanager and is ended as soon as the dashboard sees the alert resolve. A 404
        means the alert is not firing; a 503 that Alertmanager did not answer, or that the
        dashboard runs without one.
      tags: [alerts]
      parameters:
        - name: fingerprint
          in: path
          required: true
          description: Alertmanager's fingerprint of the alert.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[0-9a-f]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SilenceRequest"
      responses:
        "201":
          description: The silence Alertmanager now holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Silence"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/pins:
    get:
      operationId: listPins
      summary: List every Project's pin, by Project
      description: >-
        Every projects/<project>/source.yaml on the Estate repository's default branch: the digest its source names, and a Pause or a Rollback recorded on it. A 503 means GitHub did not answer, or the dashboard runs without the Estate repository.
      tags: [estate]
      responses:
        "200":
          description: What the Estate repository holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/handover:
    get:
      operationId: getHandover
      summary: Show each Project's delivery path
      description: >-
        The handover ledger from platform.intent.yml on the Estate repository's default branch. It
        lists the Projects their pins deliver, and the ones fleet-infra still delivers. A document
        with no ledger has handed every Project over, so nothing is legacy. A 503 means GitHub did
        not answer, or the dashboard has no Estate repository.
      tags: [estate]
      responses:
        "200":
          description: The handover ledger.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Handover"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/projects/{project}/deploys:
    get:
      operationId: listDeploys
      summary: List the commits that moved a Project's pin, newest first
      description: >-
        The Estate repository's history of projects/<project>/source.yaml: its deploy log. A Project with no pin has none. A 503 means GitHub did not answer, or the dashboard runs without the Estate repository.
      tags: [estate]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
        - name: limit
          in: query
          required: false
          description: How many deploys to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: What the Estate repository holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeployList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/projects/{project}/rollouts:
    get:
      operationId: listRollouts
      summary: List a Project's rollouts to production, newest first
      description: >-
        The production deployments composition opened for the Project in its repository, with the
        stages the Reporter wrote on each and the run that logged them. A repository outside the estate's owner has none. A 503
        means GitHub did not answer, or the dashboard has no Estate repository.
      tags: [estate]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
        - name: repository
          in: query
          required: true
          description: The repository the Project publishes from, as owner/name.
          schema:
            type: string
            minLength: 3
            maxLength: 140
            pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$"
        - name: limit
          in: query
          required: false
          description: How many rollouts to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: The rollouts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolloutList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{project}/logs/streams:
    get:
      operationId: listLogStreams
      summary: List the containers of a Project that wrote logs
      description: >-
        Every pod and container in the Project's namespace that wrote logs in the window: running
        Processes, past ones and migration Jobs, from Loki. A 503 means Loki did not answer, or the
        dashboard runs without one.
      tags: [logs]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
        - name: hours
          in: query
          required: false
          description: How many hours back to look.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 720
            default: 24
      responses:
        "200":
          description: What Loki holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{project}/logs:
    get:
      operationId: listLogLines
      summary: Read one container's logs, oldest first
      description: >-
        The newest lines one container of the Project wrote in the window, from Loki, oldest first.
        A 503 means Loki did not answer, or the dashboard runs without one.
      tags: [logs]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
        - name: hours
          in: query
          required: false
          description: How many hours back to look.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 720
            default: 24
        - name: pod
          in: query
          required: true
          description: The pod.
          schema:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"
        - name: container
          in: query
          required: true
          description: The container.
          schema:
            type: string
            minLength: 1
            maxLength: 253
            pattern: "^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$"
        - name: limit
          in: query
          required: false
          description: How many lines to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 5000
            default: 500
      responses:
        "200":
          description: What Loki holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogLines"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/releases/notes:
    get:
      operationId: getReleaseNotes
      summary: Read a release's notes
      description: >-
        The body of the GitHub Release a repository of the estate published for a version, as
        Markdown. A 404 means there is none. A 503 means GitHub did not answer, or the dashboard
        runs without the Estate repository.
      tags: [estate]
      parameters:
        - name: repository
          in: query
          required: true
          description: The repository, owner/name.
          schema:
            type: string
            minLength: 3
            maxLength: 140
            pattern: "^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$"
        - name: version
          in: query
          required: true
          description: The release.
          schema:
            type: string
            minLength: 5
            maxLength: 64
            pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([-+][0-9A-Za-z.-]+)?$"
      responses:
        "200":
          description: The notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseNotes"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/composition/runs:
    get:
      operationId: listCompositionRuns
      summary: List the estate's composition runs, newest first
      description: >-
        Each run of the estate's compose.yml: when, what started it, its outcome, and what it composed.
        Read from each run's artifact (#30). A 503 means the runs are not read yet, or GitHub did not
        answer.
      tags: [estate]
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompositionRunList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/projects/{project}/declaration:
    get:
      operationId: getDeclaration
      summary: Read what a Project declares at its pinned release
      description: >-
        The Applications, Processes, migration, rollback and grants the Project's Intent Fragment
        declares, at the version its pin was composed from (#31). A 503 means fragments are not read
        yet, or the registry did not answer.
      tags: [estate]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: The declaration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Declaration"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/estate/issues:
    get:
      operationId: listIssues
      summary: List the open issues, most recently updated first
      description: >-
        The Estate repository's open issues: one per Project condition the composition keeps open. At most one page of 100. A 503 means GitHub did not answer, or the dashboard runs without the Estate repository.
      tags: [estate]
      responses:
        "200":
          description: What the Estate repository holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/delivery/sources:
    get:
      operationId: listSources
      summary: List the pin sources, by name
      description: >-
        Every Flux OCIRepository the render wrote: the artifact it names by digest, what Flux last fetched, and whether it is ready. A 503 means the cluster did not answer, or the dashboard runs without one.
      tags: [delivery]
      responses:
        "200":
          description: What the cluster holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/delivery/units:
    get:
      operationId: listUnits
      summary: List the Reconcile Units, by name
      description: >-
        Every Flux Kustomization the render wrote: its source, its path, the units it follows, what it last applied, and whether it is ready. A 503 means the cluster did not answer, or the dashboard runs without one.
      tags: [delivery]
      responses:
        "200":
          description: What the cluster holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/delivery/releases:
    get:
      operationId: listReleases
      summary: List the gated Applications and their releases
      description: >-
        Every Application whose release-gate inputs the render wrote, by namespace and Application: each member as Flagger switches it, the migration the gate may start, and what the Release Gate recorded it serves and saw pinned. A 503 means the cluster did not answer, or the dashboard runs without one.
      tags: [delivery]
      responses:
        "200":
          description: What the cluster holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/delivery/projects/{project}/pods:
    get:
      operationId: listPods
      summary: List the pods a Project runs
      description: >-
        Every pod the render's workloads run in the Project's namespace, by Process then name: where it
        runs, the release its label names, and each container's state, restarts and probes, as the
        kubelet reports them. A 503 means the cluster did not answer, or the dashboard runs without one.
      tags: [delivery]
      parameters:
        - name: project
          in: path
          required: true
          description: The Project.
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: "^[a-z0-9_][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: What the cluster holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PodList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/checks:
    get:
      operationId: listChecks
      summary: List the uptime checks
      description: >-
        Every endpoint the uptime monitor probes, by group then name, with its latest result and whether
        each recent probe succeeded. A 503 means the monitor did not answer, or the dashboard runs
        without one.
      tags: [checks]
      responses:
        "200":
          description: What the monitor holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckList"
        "401":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/alerts/history:
    get:
      operationId: listAlertHistory
      summary: List the states alerts were seen in, newest first
      description: >-
        Returns at most `limit` events, newest first. An event is one state of one firing of an
        alert: it fired, or it resolved. Alertmanager forgets a resolved alert; this is the
        dashboard's own record.
      tags: [alerts]
      parameters:
        - name: limit
          in: query
          required: false
          description: How many events to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertHistory"
        "400":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-estate_session
      description: >-
        The dashboard's own session, set when an admin signs in through auth at `/auth/login`. The
        cookie holds a sealed session id and nothing else. The server refuses a request without a
        live session of an account that holds the admin role; on a local run DEV_USER stands in.
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Pin:
      description: One Project's pin.
      type: object
      additionalProperties: false
      required: [project, digest]
      properties:
        project:
          type: string
          minLength: 1
          maxLength: 63
          description: The Project.
          example: auth
        digest:
          type: string
          maxLength: 128
          description: The digest its source names; empty where the pin file holds no source.
        paused:
          $ref: "#/components/schemas/Pause"
        rolledBack:
          $ref: "#/components/schemas/Rollback"
    Pause:
      description: What a Pause or a Rollback recorded on a pin.
      type: object
      additionalProperties: false
      required: [by, at, reason]
      properties:
        by:
          type: string
          maxLength: 255
          description: The GitHub login that ran it.
        at:
          type: string
          maxLength: 64
          description: When, as recorded.
        reason:
          type: string
          maxLength: 1024
          description: The reason given.
    Rollback:
      description: The release a Rollback took the Project back to.
      type: object
      additionalProperties: false
      required: [version, fragment]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release version.
        fragment:
          type: string
          maxLength: 256
          description: That release's fragment, by digest.
    PinList:
      description: Every Project's pin, by Project.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          description: The pins.
          items:
            $ref: "#/components/schemas/Pin"
    Handover:
      description: Each Project's delivery path.
      type: object
      additionalProperties: false
      required: [estate, legacy]
      properties:
        estate:
          type: array
          maxItems: 1000
          description: Names of the Projects delivered by their pins.
          items:
            type: string
            maxLength: 63
        legacy:
          type: array
          maxItems: 1000
          description: Names of the Projects still delivered by fleet-infra.
          items:
            type: string
            maxLength: 63
    Stage:
      description: One step of a rollout.
      type: object
      additionalProperties: false
      required: [state, description, at]
      properties:
        state:
          type: string
          maxLength: 32
          description: GitHub's deployment state, lower case.
          example: in_progress
        description:
          type: string
          maxLength: 256
          description: What happened.
        log:
          type: string
          maxLength: 2048
          description: The run that logged it.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it happened.
    Rollout:
      description: One release of a Project reaching production.
      type: object
      additionalProperties: false
      required: [id, version, commit, at, stages]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The GitHub Deployment's id.
        version:
          type: string
          maxLength: 128
          description: The release.
          example: 0.2.0
        commit:
          type: string
          maxLength: 64
          description: The commit the release was built from.
        run:
          type: string
          maxLength: 2048
          description: The composition run that pinned it.
        artifact:
          type: string
          maxLength: 512
          description: The rendered artifact its pin names.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it was pinned.
        stages:
          type: array
          maxItems: 20
          description: Its stages, newest first.
          items:
            $ref: "#/components/schemas/Stage"
    RolloutList:
      description: A Project's rollouts, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The rollouts.
          items:
            $ref: "#/components/schemas/Rollout"
    Stream:
      description: One container of one pod that wrote logs.
      type: object
      additionalProperties: false
      required: [pod, container]
      properties:
        pod:
          type: string
          maxLength: 253
          description: The pod.
        container:
          type: string
          maxLength: 253
          description: The container.
        version:
          type: string
          maxLength: 128
          description: The release the pod ran, from its app.kubernetes.io/version label; absent without one.
        first:
          type: string
          format: date-time
          maxLength: 64
          description: When it wrote its first line in the window.
        last:
          type: string
          format: date-time
          maxLength: 64
          description: When it wrote its latest line.
    StreamList:
      description: The containers that wrote logs, by pod then container.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          description: The containers.
          items:
            $ref: "#/components/schemas/Stream"
    LogLine:
      description: One log line.
      type: object
      additionalProperties: false
      required: [at, text]
      properties:
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it was written.
        text:
          type: string
          maxLength: 65536
          description: The line.
    LogLines:
      description: A container's lines, oldest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5000
          description: The lines.
          items:
            $ref: "#/components/schemas/LogLine"
    ReleaseNotes:
      description: A release's notes.
      type: object
      additionalProperties: false
      required: [version, body]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release.
        body:
          type: string
          maxLength: 125000
          description: The notes, as Markdown.
        url:
          type: string
          maxLength: 2048
          description: The GitHub Release.
        publishedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it was published.
    CompositionFragment:
      description: One fragment a run read.
      type: object
      additionalProperties: false
      required: [project, version, outcome, published]
      properties:
        project:
          type: string
          maxLength: 63
          description: The Project.
        version:
          type: string
          maxLength: 64
          description: Its release.
        outcome:
          type: string
          enum: [moved, unchanged, isolated, stale, held]
          description: What the run did with it.
        reason:
          type: string
          maxLength: 512
          description: Why, where it was set aside or held.
        published:
          type: string
          format: date-time
          maxLength: 64
          description: When it was published.
    CompositionRun:
      description: One composition run.
      type: object
      additionalProperties: false
      required: [id, at, trigger, outcome, moved, fragments, url]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: The workflow run's id.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it ran.
        trigger:
          type: string
          maxLength: 256
          description: What started it.
        outcome:
          type: string
          enum: [composed, isolated, failed]
          description: All composed, some set aside, or the run failed.
        lock:
          type: string
          maxLength: 128
          description: The composition lock it published.
        toolkit:
          type: string
          maxLength: 64
          description: The deploy-kit release it composed with.
        snapshotAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the cluster snapshot it read was taken.
        moved:
          type: array
          maxItems: 1000
          description: The Projects whose pin it moved.
          items:
            type: string
            maxLength: 63
        fragments:
          type: array
          maxItems: 1000
          description: Every fragment it read.
          items:
            $ref: "#/components/schemas/CompositionFragment"
        url:
          type: string
          maxLength: 2048
          description: The workflow run.
    CompositionRunList:
      description: Composition runs, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The runs.
          items:
            $ref: "#/components/schemas/CompositionRun"
    DeclaredProcess:
      description: One Process an Application declares.
      type: object
      additionalProperties: false
      required: [name, switchover, replicas]
      properties:
        name:
          type: string
          maxLength: 63
          description: The Process.
        description:
          type: string
          maxLength: 200
          description: What it does, in one sentence, from the project file.
        switchover:
          type: string
          enum: [blue-green, continuous, interrupted]
          description: How a new release replaces it.
        replicas:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
          description: How many run.
    DeclaredMigration:
      description: How an Application moves its schema.
      type: object
      additionalProperties: false
      required: [runner, undo]
      properties:
        runner:
          type: string
          maxLength: 64
          description: What runs it, liquibase or self.
        identity:
          type: string
          maxLength: 128
          description: The migration identity.
        provenAgainst:
          type: string
          maxLength: 64
          description: The release it was proven against.
        undo:
          type: string
          enum: [allowed, blocked]
          description: Whether a down migration may run.
        reason:
          type: string
          maxLength: 256
          description: Why, where undo is blocked.
    DeclaredApplication:
      description: One Application a Project declares.
      type: object
      additionalProperties: false
      required: [id, processes]
      properties:
        id:
          type: string
          maxLength: 63
          description: The Application.
        description:
          type: string
          maxLength: 200
          description: What it does, in one sentence, from the project file.
        processes:
          type: array
          maxItems: 64
          description: Its Processes.
          items:
            $ref: "#/components/schemas/DeclaredProcess"
        migration:
          $ref: "#/components/schemas/DeclaredMigration"
    Grant:
      description: One secret a Process may read or use.
      type: object
      additionalProperties: false
      required: [process, path, access]
      properties:
        process:
          type: string
          maxLength: 63
          description: The Process.
        path:
          type: string
          maxLength: 512
          description: The Vault path.
        access:
          type: string
          maxLength: 32
          description: read, or the transit operations.
    Declaration:
      description: What a Project declares at its pinned release.
      type: object
      additionalProperties: false
      required: [version, applications, grants, rollback]
      properties:
        version:
          type: string
          maxLength: 64
          description: The release it was read from.
        applications:
          type: array
          maxItems: 64
          description: Its Applications.
          items:
            $ref: "#/components/schemas/DeclaredApplication"
        grants:
          type: array
          maxItems: 512
          description: Every grant its Processes hold.
          items:
            $ref: "#/components/schemas/Grant"
        rollback:
          type: array
          maxItems: 16
          description: What a Rollback does first, in order.
          items:
            type: string
            maxLength: 256
    Deploy:
      description: One commit that moved a pin.
      type: object
      additionalProperties: false
      required: [commit, at, message]
      properties:
        commit:
          type: string
          minLength: 1
          maxLength: 64
          description: The commit.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it was committed.
        message:
          type: string
          maxLength: 1024
          description: Its subject line.
    DeployList:
      description: A Project's deploys, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The deploys.
          items:
            $ref: "#/components/schemas/Deploy"
    Issue:
      description: One open issue of the Estate repository.
      type: object
      additionalProperties: false
      required: [number, title, url, labels, updatedAt]
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: The issue number.
        title:
          type: string
          maxLength: 1024
          description: Its title.
        url:
          type: string
          maxLength: 1024
          description: Where it is on GitHub.
        labels:
          type: array
          maxItems: 100
          description: Its labels.
          items:
            type: string
            maxLength: 255
        updatedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it last changed.
        project:
          type: string
          maxLength: 63
          description: >-
            The Project the issue is for, from the marker at the end of its body. Absent if a
            person opened the issue.
          example: knowledge
        condition:
          type: string
          maxLength: 64
          description: The condition, from the same marker.
          example: isolated
    IssueList:
      description: The open issues, most recently updated first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The issues.
          items:
            $ref: "#/components/schemas/Issue"
    Source:
      description: One Flux OCIRepository.
      type: object
      additionalProperties: false
      required: [name, url, digest, ready]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: The source's name, project-<project> or estate.
          example: project-auth
        url:
          type: string
          maxLength: 1024
          description: The OCI repository of the artifact.
          example: oci://ghcr.io/jorisjonkers-dev/render/auth
        digest:
          type: string
          maxLength: 128
          description: The digest the pin names; sixty-four zeros until the first publish.
        revision:
          type: string
          maxLength: 128
          description: What Flux last fetched, where it fetched anything.
        ready:
          type: boolean
          description: Whether Flux reports the object Ready.
        reason:
          type: string
          maxLength: 256
          description: The Ready condition's reason, where there is one.
        message:
          type: string
          maxLength: 4096
          description: The Ready condition's message, where there is one.
    SourceList:
      description: The pin sources, by name.
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        truncated:
          type: boolean
          description: >-
            Whether the cluster holds more than one read returns. A read is bounded, so a cluster
            holding more says so here rather than leaving the rest out unseen.
        items:
          type: array
          maxItems: 1000
          description: The sources.
          items:
            $ref: "#/components/schemas/Source"
    Unit:
      description: One Flux Kustomization, one Reconcile Unit.
      type: object
      additionalProperties: false
      required: [name, source, path, dependsOn, ready]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 253
          description: The unit's name.
          example: apps-auth
        source:
          type: string
          maxLength: 253
          description: The source it applies from.
          example: project-auth
        path:
          type: string
          maxLength: 1024
          description: The directory of the artifact it applies.
          example: ./apps/auth
        dependsOn:
          type: array
          maxItems: 256
          description: The units it follows.
          items:
            type: string
            maxLength: 253
        applied:
          type: string
          maxLength: 128
          description: The source revision Flux last applied, where it applied anything.
        version:
          type: string
          maxLength: 128
          description: >-
            The release the unit's pin names, from the event.toolkit.fluxcd.io/version annotation.
            Absent if composition wrote none.
          example: 0.6.0
        repository:
          type: string
          maxLength: 256
          description: >-
            The repository the release came from, from the event.toolkit.fluxcd.io/repository
            annotation. Absent if composition wrote none.
          example: JorisJonkers-dev/delivery
        ready:
          type: boolean
          description: Whether Flux reports the object Ready.
        reason:
          type: string
          maxLength: 256
          description: The Ready condition's reason, where there is one.
        message:
          type: string
          maxLength: 4096
          description: The Ready condition's message, where there is one.
    UnitList:
      description: The Reconcile Units, by name.
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        truncated:
          type: boolean
          description: >-
            Whether the cluster holds more than one read returns. A read is bounded, so a cluster
            holding more says so here rather than leaving the rest out unseen.
        items:
          type: array
          maxItems: 1000
          description: The units.
          items:
            $ref: "#/components/schemas/Unit"
    Probes:
      description: Which checks the kubelet runs on a container.
      type: object
      additionalProperties: false
      required: [readiness, liveness, startup]
      properties:
        readiness:
          type: boolean
          description: Whether it has a readiness probe.
        liveness:
          type: boolean
          description: Whether it has a liveness probe.
        startup:
          type: boolean
          description: Whether it has a startup probe.
    Termination:
      description: How a container last ended.
      type: object
      additionalProperties: false
      required: [exitCode]
      properties:
        reason:
          type: string
          maxLength: 256
          description: Why, as the kubelet says, OOMKilled or Error.
        exitCode:
          type: integer
          format: int32
          minimum: -2147483648
          maximum: 2147483647
          description: Its exit code.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it ended.
    PodContainer:
      description: One container of a pod.
      type: object
      additionalProperties: false
      required: [name, image, init, ready, restarts, probes]
      properties:
        name:
          type: string
          maxLength: 253
          description: The container.
        image:
          type: string
          maxLength: 1024
          description: The image it runs.
        init:
          type: boolean
          description: Whether it is an init container, which runs to completion before the others start.
        ready:
          type: boolean
          description: Whether the kubelet reports it ready.
        state:
          type: string
          enum: [running, waiting, terminated]
          description: What it is doing now; absent before the kubelet reports it.
        reason:
          type: string
          maxLength: 256
          description: Why it waits or ended, where the kubelet says.
        message:
          type: string
          maxLength: 4096
          description: The kubelet's message, where there is one.
        since:
          type: string
          format: date-time
          maxLength: 64
          description: When it started running, or ended.
        restarts:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: How often it restarted.
        last:
          $ref: "#/components/schemas/Termination"
        probes:
          $ref: "#/components/schemas/Probes"
    Pod:
      description: One pod a Project runs.
      type: object
      additionalProperties: false
      required: [name, process, ready, deleting, containers]
      properties:
        name:
          type: string
          maxLength: 253
          description: The pod.
        process:
          type: string
          maxLength: 63
          description: The Process, from its app.kubernetes.io/name label.
        application:
          type: string
          maxLength: 63
          description: The Application, from its app.kubernetes.io/part-of label.
        version:
          type: string
          maxLength: 128
          description: The release it runs, from its app.kubernetes.io/version label; absent without one.
        owner:
          type: string
          maxLength: 63
          description: The kind that made it, ReplicaSet, StatefulSet, DaemonSet or Job.
        node:
          type: string
          maxLength: 253
          description: The node it runs on, once scheduled.
        phase:
          type: string
          maxLength: 32
          description: Its phase, Pending, Running, Succeeded or Failed.
        started:
          type: string
          format: date-time
          maxLength: 64
          description: When the kubelet started it.
        ready:
          type: boolean
          description: Whether its Ready condition holds.
        deleting:
          type: boolean
          description: Whether it is shutting down.
        containers:
          type: array
          maxItems: 64
          description: Its init containers, then its containers.
          items:
            $ref: "#/components/schemas/PodContainer"
    PodList:
      description: The pods a Project runs, by Process then name.
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        truncated:
          type: boolean
          description: Whether the namespace holds more than one read returns.
        items:
          type: array
          maxItems: 1000
          description: The pods.
          items:
            $ref: "#/components/schemas/Pod"
    CheckCondition:
      description: One condition a probe holds an answer to.
      type: object
      additionalProperties: false
      required: [condition, success]
      properties:
        condition:
          type: string
          maxLength: 256
          description: The condition, as the monitor writes it.
        success:
          type: boolean
          description: Whether the answer held it.
    Check:
      description: One endpoint the uptime monitor probes, and its latest result.
      type: object
      additionalProperties: false
      required: [key, name, group, up, conditions, recent]
      properties:
        key:
          type: string
          maxLength: 256
          description: The monitor's name for the endpoint, unique across groups.
        name:
          type: string
          maxLength: 128
          description: The endpoint.
        group:
          type: string
          maxLength: 128
          description: The group it is shown in.
        host:
          type: string
          maxLength: 253
          description: The host the probe reached.
        at:
          type: string
          format: date-time
          maxLength: 64
          description: When it last probed; absent before its first probe.
        up:
          type: boolean
          description: Whether the latest probe succeeded.
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          description: The HTTP status the latest probe got, where it got one.
        durationMs:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400000
          description: How long the latest probe took, in milliseconds.
        error:
          type: string
          maxLength: 1024
          description: Why the latest probe failed, where the monitor says.
        conditions:
          type: array
          maxItems: 32
          description: The latest probe's conditions.
          items:
            $ref: "#/components/schemas/CheckCondition"
        recent:
          type: array
          maxItems: 20
          description: Whether each of the latest probes succeeded, oldest first.
          items:
            type: boolean
    CheckList:
      description: The uptime checks, by group then name.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          description: The checks.
          items:
            $ref: "#/components/schemas/Check"
    Member:
      description: One member of a gated Application, as Flagger switches it.
      type: object
      additionalProperties: false
      required: [process, iterations]
      properties:
        process:
          type: string
          minLength: 1
          maxLength: 253
          description: The member Process.
          example: auth-api
        phase:
          type: string
          maxLength: 64
          description: Flagger's phase of its Canary; absent before Flagger has seen it.
          example: Progressing
        revision:
          type: string
          maxLength: 128
          description: The Application revision its Canary's webhooks carry.
        iterations:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: The analysis iterations Flagger has counted.
    ReleaseMigration:
      description: The migration the gate may start for a release.
      type: object
      additionalProperties: false
      required: [identity, nonTransactional]
      properties:
        identity:
          type: string
          minLength: 1
          maxLength: 253
          description: The identity its Jobs run as.
          example: auth-migration
        testedAgainst:
          type: string
          maxLength: 128
          description: The serving revision the release was proven against; absent on a first release.
        nonTransactional:
          type: boolean
          description: Whether a changeset of it cannot run in a transaction, which no undo touches.
    Release:
      description: One gated Application.
      type: object
      additionalProperties: false
      required: [namespace, application, members]
      properties:
        namespace:
          type: string
          minLength: 1
          maxLength: 63
          description: The Application's namespace.
          example: auth-system
        application:
          type: string
          minLength: 1
          maxLength: 253
          description: The Application.
          example: auth
        members:
          type: array
          maxItems: 64
          description: Its members.
          items:
            $ref: "#/components/schemas/Member"
        migration:
          $ref: "#/components/schemas/ReleaseMigration"
        serving:
          type: string
          maxLength: 128
          description: The revision the Release Gate recorded it serves; absent before it recorded one.
        pinned:
          type: string
          maxLength: 128
          description: The revision the gate saw applied and not yet serving; absent when none is.
        since:
          type: string
          format: date-time
          maxLength: 64
          description: When the gate first saw the pinned revision.
        unreadable:
          type: string
          maxLength: 256
          description: >-
            Why the rest of this release could not be read, where it could not: no inputs, inputs or
            a record that do not parse, or more members than an Application has. Absent when it was
            read whole.
          example: release-gate inputs that do not parse
    ReleaseList:
      description: The gated Applications.
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        truncated:
          type: boolean
          description: >-
            Whether the cluster holds more than one read returns. A read is bounded, so a cluster
            holding more says so here rather than leaving the rest out unseen.
        items:
          type: array
          maxItems: 1000
          description: The releases.
          items:
            $ref: "#/components/schemas/Release"
    Alert:
      description: One alert Alertmanager holds now.
      type: object
      additionalProperties: false
      required: [fingerprint, name, startsAt, labels, silencedBy]
      properties:
        fingerprint:
          type: string
          minLength: 1
          maxLength: 64
          description: Alertmanager's fingerprint of the alert.
          example: 9f2c1a7b3d4e5f60
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The alert's name, its alertname label.
          example: ReleaseHeld
        class:
          type: string
          enum: [business-hours, urgent, page]
          description: >-
            How loudly the alert wakes someone, from its alert_class label. Absent on an alert whose
            rule carries no class the dashboard knows.
          example: urgent
        summary:
          type: string
          maxLength: 1024
          description: The rule's summary annotation, where it carries one.
          example: auth is held at its serving revision.
        startsAt:
          type: string
          format: date-time
          maxLength: 64
          description: When this firing of the alert started.
          example: "2026-10-03T07:00:00Z"
        labels:
          type: object
          maxProperties: 64
          description: Every label of the alert.
          additionalProperties:
            type: string
            maxLength: 1024
          example:
            alertname: ReleaseHeld
            namespace: auth-system
        silencedBy:
          type: array
          maxItems: 64
          description: The id of every silence that holds the alert quiet now; empty when none does.
          items:
            type: string
            minLength: 1
            maxLength: 64
    AlertList:
      description: The alerts firing now, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1000
          description: The alerts.
          items:
            $ref: "#/components/schemas/Alert"
    SilenceRequest:
      description: How long to silence an alert for.
      type: object
      additionalProperties: false
      required: [length]
      properties:
        length:
          type: string
          enum: [1h, 4h, 1d, until-resolved]
          description: An hour, four hours, a day, or until the alert resolves.
          example: 4h
    Silence:
      description: A silence the dashboard set in Alertmanager.
      type: object
      additionalProperties: false
      required: [id, fingerprint, createdBy, createdAt]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: Alertmanager's id of the silence.
          example: 6b3f1c2a-7d4e-4f50-8a91-0b2c3d4e5f60
        fingerprint:
          type: string
          minLength: 1
          maxLength: 64
          description: The silenced alert's fingerprint.
          example: 9f2c1a7b3d4e5f60
        createdBy:
          type: string
          minLength: 1
          maxLength: 255
          description: The admin who set it.
          example: joris
        createdAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it was set.
          example: "2026-10-03T07:05:00Z"
        endsAt:
          type: string
          format: date-time
          maxLength: 64
          description: When it ends. Absent on a silence that lasts until the alert resolves.
          example: "2026-10-03T11:05:00Z"
    AlertEvent:
      description: One state an alert was seen in.
      type: object
      additionalProperties: false
      required: [id, fingerprint, name, status, startsAt, observedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: The event's id.
          example: 42
        fingerprint:
          type: string
          minLength: 1
          maxLength: 64
          description: Alertmanager's fingerprint of the alert.
          example: 9f2c1a7b3d4e5f60
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: The alert's name.
          example: CollectorStopped
        status:
          type: string
          enum: [firing, resolved]
          description: The state the alert was seen in.
          example: resolved
        startsAt:
          type: string
          format: date-time
          maxLength: 64
          description: When this firing of the alert started.
          example: "2026-10-03T07:00:00Z"
        endsAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the alert resolved. Present exactly when the status is resolved.
          example: "2026-10-03T07:30:00Z"
        observedAt:
          type: string
          format: date-time
          maxLength: 64
          description: When the dashboard saw the alert in this state.
          example: "2026-10-03T07:30:20Z"
    Session:
      description: The signed-in admin.
      type: object
      additionalProperties: false
      required: [subject, name]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: The account's id in auth.
          example: 3f6c2a1e-8b7d-4c5f-9a10-2b3c4d5e6f70
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: What to call the admin, which is the account's username.
          example: joris
    AlertHistory:
      description: A page of events, newest first.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          description: The events.
          items:
            $ref: "#/components/schemas/AlertEvent"
    Problem:
      description: An RFC 9457 problem detail.
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          maxLength: 256
          description: A URI naming the problem type.
          example: about:blank
        title:
          type: string
          maxLength: 256
          description: A short summary of the problem type.
          example: Bad request
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code.
          example: 400
        detail:
          type: string
          maxLength: 1024
          description: What went wrong in this occurrence.
          example: The limit is out of range.
