# Local Postgres and Alertmanager for `task dev` and `task e2e`. Published on 55432 and 59093 so
# ones already running on the default ports do not collide with them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      retries: 30
  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports:
      - "59093:9093"
