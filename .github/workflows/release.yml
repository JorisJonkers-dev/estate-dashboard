# Tag -> release flow (org standard).
#
# release-please maintains a release PR that accumulates conventional commits
# and, when merged, creates a vX.Y.Z git tag + GitHub Release and bumps the
# version manifest. Publishing of artifacts (Maven/npm to GitHub Packages,
# images to GHCR) hangs off the published-release event below.
#
# This gives every repo an explicit, immutable version. Consumers pin exact
# versions (see VERSIONING.md); nothing deploys or resolves from a moving
# branch.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Author the release PR with the personal-stack-agents App token (not the
      # default GITHUB_TOKEN) so CI runs on the PR without a manual approval
      # gate. Best-effort: falls back to GITHUB_TOKEN when the App secrets or
      # installation are absent.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        continue-on-error: true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The image, multi-arch (the estate's nodes are amd64 and arm64), tagged with
  # the release and pinned downstream by digest. The images lock share this
  # writes is what the estate pins it by
  # (deploy-kit spec/v1/20-resolved-deployment.md#the-images-lock). One job:
  # jobs are billed by the minute, rounded up.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image, and write the images lock share
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ghcr.io/jorisjonkers-dev/estate-dashboard
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker buildx build . \
            --secret id=github_token,env=GITHUB_TOKEN \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="${TAG#v}" \
            --tag "${IMAGE}:${TAG}" \
            --metadata-file image.json \
            --push
          digest="$(jq -r '."containerimage.digest"' image.json)"
          # The user the image runs as, read back from what was pushed rather
          # than assumed from the Dockerfile.
          user="$(docker buildx imagetools inspect "${IMAGE}@${digest}" --format '{{ json .Image }}' \
            | jq -r 'if has("linux/amd64") then .["linux/amd64"] else . end | .config.User')"
          case "$user" in
            *[!0-9:]*|""|*:|:*) echo "::error::estate-dashboard runs as '${user}', not a numeric uid:gid"; exit 1 ;;
          esac
          cat > images.lock.yml <<LOCK
          apiVersion: lock.jorisjonkers.dev/v1
          kind: ImagesLock
          schemaVersion: 1.0.0
          name: estate-dashboard
          images:
            estate-dashboard:
              repository: ${IMAGE}
              digest: "${digest}"
              uid: ${user%%:*}
              gid: ${user##*:}
          LOCK
          cat images.lock.yml >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images-lock
          path: images.lock.yml

  # The Intent Fragment for the same release: the project file, packed with the
  # images lock share the job above wrote, pushed and signed, and composition
  # started in JorisJonkers-dev/estate
  # (deploy-kit spec/v1/40-composition.md#fragments). It is validated beside
  # the fragments of what it depends on that this repository's token can read:
  # auth and delivery's Release Gate. data's Postgres publishes from the private
  # estate repository, so composition alone checks that edge.
  fragment:
    needs: [release-please, publish]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: JorisJonkers-dev/github-workflows/.github/workflows/publish-fragment.yml@362acd5420236edb73a797ece311c73c39510c25 # v0.27.0
    with:
      project-file: deploy/estate-dashboard.project.yml
      version: ${{ needs.release-please.outputs.tag_name }}
      validate-with: deploy/env
      validate-with-fragments: auth delivery
      images-lock-artifact: images-lock
    secrets:
      ESTATE_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.ESTATE_DISPATCH_APP_PRIVATE_KEY }}
