# Toolchain for local work and CI (jdx/mise-action). `mise install` is the only setup step.
[tools]
go = "1.27.2"
node = "24.22.0"
pnpm = "12.14.0"
task = "3.54.0"
golangci-lint = "2.15.0"
actionlint = "1.7.12"
gitleaks = "8.30.1"
sqlc = "1.31.1"
"github:sbdchd/squawk" = "2.70.0"
# The release binary: building from source in CI fails whenever sum.golang.org drops a stream.
"aqua:daveshanley/vacuum" = "0.33.1"
"go:github.com/vladopajic/go-test-coverage/v2" = "2.20.0"
