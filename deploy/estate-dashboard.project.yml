# deploy-kit Project Intent for the estate's admin dashboard: one Process serving the API and the
# embedded web app, reading the project's Postgres database. Shape follows spec/v1/examples/minimal
# and spec/v1/examples/knowledge in JorisJonkers-dev/deploy-kit.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: estate-dashboard # the namespace derives: estate-dashboard-system; the database: estate-dashboard_db
owner: joris

applications:
  - id: estate-dashboard
    # The binary applies its goose migrations at startup (db/migrations), so it holds the owner
    # role and startupBudget covers the migration.
    migration: self

    # No observability block: the dashboard serves no /metrics yet.
    exposure:
      - name: public
        host: estate.jorisjonkers.dev # the host auth-api registered the dashboard's OIDC client for
        # Two checks, on purpose. The edge's forward-auth admits only a browser signed in to
        # auth, so nobody else reaches the host at all. Behind it the dashboard is an OIDC client
        # of auth with a session of its own, and refuses every request without a live admin
        # session (openapi/v1/openapi.yaml): being signed in is not being an admin, and the edge
        # cannot tell the two apart.
        audience: authenticated
        contentPolicy: strict
        routes:
          - { path: /, match: prefix, process: estate-dashboard, surface: http }

    processes:
      - name: estate-dashboard
        lifecycle: application
        image: estate-dashboard # an alias; the lock resolves digest, uid and gid
        runtime: none # a static Go binary needs no Runtime Profile

        provides:
          http: 8080 # matches the default ADDR; above 1024, so no CAP_NET_BIND_SERVICE

        # The edge derives the project's database and this Process's data credential.
        dependsOn:
          - application: platform-postgres
            surface: postgres
            credentials: { rotation: { tolerates: restart } } # pgxpool reads its URL once
          # Signing in and every renewal call auth: discovery, its keys and its token endpoint.
          - { application: auth, surface: http }

        # What signing in needs and nobody else reads: the client secret auth registered for
        # `estate-dashboard`, and the key the session cookie and the stored refresh tokens are
        # sealed with. One document, because its reader set is this one Process. Both are read
        # once, at startup (deploy/env/estate-dashboard/base.env).
        secrets:
          - path: secret/data/estate-dashboard-system/sign-in
            keys: [oidc-client-secret, session-key, github-token]
            access: read
            delivery: env
            rotation: { tolerates: restart }

        # Read-only by design: it reads delivery and writes nothing in the cluster. Its one write
        # anywhere is an Alertmanager silence, over HTTP, which no Kubernetes verb grants.
        api:
          reason: >-
            the dashboard shows each Project's Flux source and unit and each member's Canary, so it
            gets, lists and watches those; and each gated Application's release-gate inputs and the
            Release Gate's record of it, which it gets by name and never lists
          rules:
            - group: source.toolkit.fluxcd.io
              objects: [ocirepositories]
              verbs: [get, list, watch]
            - group: kustomize.toolkit.fluxcd.io
              objects: [kustomizations]
              verbs: [get, list, watch]
            - group: flagger.app
              objects: [canaries]
              verbs: [get, list, watch]
            - group: core
              objects: [configmaps]
              verbs: [get]

        placement:
          memory: 96Mi
          cpu: 50m

        probes:
          readiness: { path: /readyz, port: 8080 } # fails while Postgres does not answer
          liveness: { path: /healthz, port: 8080 }

        startupBudget: 30s # covers the migrations

        # No volumes, so a continuous cutover is honourable.
        cutover: continuous
